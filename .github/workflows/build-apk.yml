
name: Build Darik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Select latest Darik project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -name 'Darik-Android-Project-v*.zip' \
            ! -name '*-OLD.zip' \
            ! -name '*-FIXED.zip' \
            ! -name '*-UI-FIX.zip' \
            ! -name '*-PHOTO-FIX.zip' \
            | sort -V | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No Darik project ZIP found."
            exit 1
          fi

          echo "Selected project: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q "${{ steps.project.outputs.zip_file }}" -d project

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$(find project -name gradlew -type f | head -n 1)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "Could not find gradlew in the ZIP."
            find project -maxdepth 3 -type f | head -n 80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLE_FILE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find project -type f -path '*/app/build/outputs/apk/debug/*.apk' \
            -exec cp {} output/Darik-debug.apk \;
          test -f output/Darik-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Darik-APK
          path: output/Darik-debug.apk
          if-no-files-found: error
          
