name: Build Darik APK

on:
workflow_dispatch:
push:
branches:
- main
paths:
- '*.zip'
- '.github/workflows/build-apk.yml'

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Find and extract Darik ZIP
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No project ZIP found in repository root."
        exit 1
      fi

      mkdir -p "$GITHUB_WORKSPACE/darik-project"
      unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/darik-project"

      SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/darik-project" \
        -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
        -print -quit)"

      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERROR: settings.gradle was not found in the ZIP."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project directory: $PROJECT_DIR"

  - name: Verify Android project
    shell: bash
    run: |
      set -euo pipefail
      test -f "$PROJECT_DIR/build.gradle" \
        -o -f "$PROJECT_DIR/build.gradle.kts"
      test -f "$PROJECT_DIR/app/build.gradle" \
        -o -f "$PROJECT_DIR/app/build.gradle.kts"
      test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

  - name: Build debug APK
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"
      gradle --no-daemon :app:assembleDebug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: Darik-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
