name: Build Darik APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Locate and extract project ZIP
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No project ZIP found in repository root."
        exit 1
      fi

      mkdir -p "$GITHUB_WORKSPACE/darik-project"
      unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/darik-project"

      SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/darik-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERROR: settings.gradle not found inside ZIP."
        exit 1
      fi

      PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build debug APK
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"
      gradle --no-daemon :app:assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Darik-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
