
name: Build Darik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Select latest project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -regextype posix-extended \
            -regex './Darik-Android-Project-v[0-9]+.*\.zip' \
            | sort -V | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No Darik project ZIP found."
            exit 1
          fi

          echo "Selected: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          set -euo pipefail
          mkdir project
          unzip -q "${{ steps.project.outputs.zip_file }}" -d project

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find project -name settings.gradle -type f -print -quit)"
          test -n "$SETTINGS"
          SRC="$(dirname "$SETTINGS")"

          test -f "$SRC/build.gradle"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          cp -a "$SRC/app" ./app
          cp "$SRC/build.gradle" ./build.gradle
          cp "$SRC/settings.gradle" ./settings.gradle

          if [ -f "$SRC/gradle.properties" ]; then
            cp "$SRC/gradle.properties" ./gradle.properties
          fi

          echo "Project prepared from $SRC"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Darik-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
